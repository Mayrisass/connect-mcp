# Base44 preview wrapper for the Quidli Connect MCP HTTP server.
#
# The MCP SDK validates the incoming Host header against a fixed allowlist
# (mcp.connect.quid.li, localhost), and the app's request-host resolver
# prefers X-Forwarded-Host when present. The preview proxy sends its own
# sandbox hostname, so we rewrite Host to "localhost" upstream and never
# forward X-Forwarded-Host. Buffering is off so SSE streams flush.
server {
    listen 80;

    location / {
        proxy_pass http://mcp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
