# Base44 dev preview wrapper for @quidli/connect-mcp.
#
# The MCP server validates the request Host header against a fixed list
# (mcp.connect.quid.li, localhost), and resolveRequestHost trusts
# X-Forwarded-Host first. The preview proxy sends its own sandbox hostname,
# so every request would be rejected with 403. This wrapper rewrites Host to
# localhost and withholds X-Forwarded-Host before forwarding to the app.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  proxy_http_version 1.1;

  server {
    listen 80;

    location / {
      proxy_pass http://mcp:8080;
      proxy_set_header Host localhost;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header Connection "";
      # Streamable HTTP can hold SSE responses open; don't buffer or cut them.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
