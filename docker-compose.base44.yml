name: quidli-connect-mcp

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    restart: on-failure
    environment:
      - CONNECT_MCP_HTTP_HOST=0.0.0.0
      - CONNECT_MCP_HTTP_PORT=8080
      # Serves keyless tool calls on the shared anonymous quota.
      - CONNECT_MCP_ALLOW_ANONYMOUS=1
      - BASE44_PREVIEW_MODE
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_FUND=false
    volumes:
      # Live source for the dev watcher.
      - .:/workspace
      # Dependencies live in a named volume (bind mount would shadow them).
      - mcp_node_modules:/workspace/node_modules
    command:
      - sh
      - -ec
      - |
        # Dependencies were installed at image build time into /opt/deps.
        # Seed the node_modules volume once (or when the lockfile changes);
        # the bind mount would otherwise hide the image's copy.
        if [ ! -f node_modules/.base44-install-stamp ] || [ package-lock.json -nt node_modules/.base44-install-stamp ]; then
          mkdir -p node_modules
          cp -a /opt/deps/node_modules/. node_modules/
          touch node_modules/.base44-install-stamp
        fi
        exec ./node_modules/.bin/tsx watch --clear-screen=false src/index-http.ts
    healthcheck:
      # The SDK host middleware only accepts its allowlist, so probe as localhost.
      test: ["CMD", "node", "-e", "const http=require('http');http.get({host:'127.0.0.1',port:8080,path:'/health',headers:{Host:'localhost'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      base44.project: "Quidli Connect MCP"
      base44.kind: "api"
      base44.port: "3000"

volumes:
  mcp_node_modules:
